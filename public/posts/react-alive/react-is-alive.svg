      .accent { fill: #fff3ec; stroke: #f26522; stroke-width: 1.6; }
      .line { fill: none; stroke: #171717; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .sub { font-size: 10.5px; fill: #8a8a85; text-anchor: middle; }
      .label { font-size: 11.5px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500">React는 여전히 뛰고 있다</text>

  <path d="M24 114H90L104 114L112 92L124 140L138 104L150 114H250" fill="none" stroke="#f26522" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M430 114H522L534 114L542 92L554 140L568 104L580 114H656" fill="none" stroke="#f26522" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="340" cy="112" r="72" fill="#fff" stroke="#171717" stroke-width="1.7"/>
  <ellipse cx="340" cy="112" rx="54" ry="20" class="line"/>
  <ellipse cx="340" cy="112" rx="54" ry="20" class="line" transform="rotate(60 340 112)"/>
  <ellipse cx="340" cy="112" rx="54" ry="20" class="line" transform="rotate(120 340 112)"/>
  <circle cx="340" cy="112" r="12" fill="#f26522"/>

  <path d="M306 176L240 206M340 184V206M374 176L440 206" class="line"/>
  <rect x="176" y="206" width="128" height="42" rx="9" class="box"/>
  <rect x="276" y="206" width="128" height="42" rx="9" class="accent"/>
  <rect x="376" y="206" width="128" height="42" rx="9" class="box"/>
  <text x="240" y="224" class="label">Compiler</text>
  <text x="240" y="239" class="sub">자동 최적화</text>
  <text x="340" y="224" class="label">React Core</text>
