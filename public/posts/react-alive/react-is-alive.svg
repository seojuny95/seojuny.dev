  <text x="440" y="224" class="label">Server</text>
  <text x="440" y="239" class="sub">RSC · 스트리밍</text>

  <text x="340" y="270" class="sub" style="font-size:11.5px;fill:#171717;opacity:.85;">모습은 달라졌지만 개발은 멈추지 않았다</text>
