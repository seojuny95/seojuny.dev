<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>How React Compiler analyzes code</title>
  <desc>React code is read as an AST, converted to a CFG-based HIR, and analyzed for data flow and mutability before caches are created for values, functions, and JSX.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, system-ui, sans-serif; fill: #171717; }
      .box { fill: #fafaf9; stroke: #d8d8d4; stroke-width: 1.5; }
      .accent { fill: #fff3ec; stroke: #f26522; stroke-width: 1.6; }
      .label { font-size: 11.5px; font-weight: 600; text-anchor: middle; }
      .sub { font-size: 9.5px; fill: #8a8a85; text-anchor: middle; }
      .detail-title { font-size: 10.5px; font-weight: 600; }
      .detail { font-size: 9.5px; fill: #8a8a85; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#8a8a85"/>
    </marker>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500">Read the code, find relationships, cache only what matters</text>
  <g>
    <rect x="20" y="48" width="112" height="72" rx="9" class="box"/>
    <text x="76" y="77" class="label">React code</text>
    <text x="76" y="92" class="sub">Functions · Hooks</text>
    <text x="76" y="106" class="sub">JSX</text>
    <line x1="138" y1="84" x2="146" y2="84" stroke="#8a8a85" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="152" y="48" width="112" height="72" rx="9" class="box"/>
    <text x="208" y="77" class="label">AST</text>
    <text x="208" y="96" class="sub">Syntax as a tree</text>
    <line x1="270" y1="84" x2="278" y2="84" stroke="#8a8a85" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="284" y="48" width="112" height="72" rx="9" class="accent"/>
    <text x="340" y="77" class="label" style="fill:#f26522;">CFG-based HIR</text>
    <text x="340" y="96" class="sub">Execution paths</text>
    <line x1="402" y1="84" x2="410" y2="84" stroke="#8a8a85" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="416" y="48" width="112" height="72" rx="9" class="box"/>
    <text x="472" y="77" class="label">Analysis</text>
    <text x="472" y="94" class="sub">data flow</text>
    <text x="472" y="107" class="sub">mutability</text>
    <line x1="534" y1="84" x2="542" y2="84" stroke="#f26522" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="548" y="48" width="112" height="72" rx="9" class="accent"/>
    <text x="604" y="77" class="label" style="fill:#f26522;">Create caches</text>
    <text x="604" y="92" class="sub">Values · Functions</text>
    <text x="604" y="106" class="sub">JSX</text>
  </g>
  <rect x="20" y="144" width="640" height="112" rx="9" class="box"/>
  <text x="40" y="168" class="detail-title">What the Compiler checks</text>
  <line x1="233" y1="180" x2="233" y2="236" stroke="#d8d8d4"/>
  <line x1="447" y1="180" x2="447" y2="236" stroke="#d8d8d4"/>
  <text x="40" y="198" class="detail-title">Syntax</text>
  <text x="40" y="216" class="detail">Which functions, conditions,</text>
  <text x="40" y="231" class="detail">and JSX are used</text>
  <text x="254" y="198" class="detail-title">Control flow</text>
  <text x="254" y="216" class="detail">Possible paths through branches</text>
  <text x="254" y="231" class="detail">and early returns</text>
  <text x="468" y="198" class="detail-title">Value relationships</text>
  <text x="468" y="216" class="detail">What each value depends on</text>
  <text x="468" y="231" class="detail">and where it may change</text>
  <text x="340" y="286" text-anchor="middle" font-size="11.5" opacity=".85">Analysis finishes at build time; optimized code goes to the browser</text>
</svg>
