      .sub { font-size: 10.5px; fill: #8a8a85; text-anchor: middle; }
      .label { font-size: 11.5px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500">React is still beating</text>
  <path d="M24 114H90L104 114L112 92L124 140L138 104L150 114H250" fill="none" stroke="#f26522" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
